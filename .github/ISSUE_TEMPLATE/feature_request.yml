name: Feature request
description: Something Ghostclip should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: markdown
    attributes:
      value: |
        Ghostclip's first goal is costing the game as few FPS as possible, so features that need work on every frame,
        a CPU encoder or anything injected into the game are unlikely to fit.
