name: Bug report
description: Something doesn't record, save or sound right.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Settings > Advanced > Copy diagnostics, then paste here: Ghostclip and Windows versions, GPUs and drivers,
        capture settings. Before 0.8.5 there is no button: write the Ghostclip version (Windows Settings > Apps >
        Installed apps), the Windows version and every GPU with its driver version instead.
      render: text
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game, and whether it runs fullscreen, borderless or windowed
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        From `%LOCALAPPDATA%\GhostclipData\Logs`: the `host-` and `worker-` files of the day it happened.
        `%LOCALAPPDATA%\GhostclipData\probe.json` says which encoders worked. Check for anything you'd rather not share (folder names, for example) before pasting.
      render: text
