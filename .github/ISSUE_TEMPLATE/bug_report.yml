name: Bug report
description: Something doesn't record, save or sound right.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ghostclip version
      description: In the title of the Settings window.
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      description: All GPUs if the PC has more than one (a laptop with integrated and dedicated graphics, for example).
      placeholder: NVIDIA RTX 3060, driver 566.36
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game, and whether it runs fullscreen, borderless or windowed
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        From `%LOCALAPPDATA%\Ghostclip\Data\Logs`: the `host-` and `worker-` files of the day it happened.
        `%LOCALAPPDATA%\Ghostclip\Data\probe.json` says which encoders worked. Check for anything you'd rather not share (folder names, for example) before pasting.
      render: text
