name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/pages.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Ghostclip.slnx -c Release

      - name: Test
        run: dotnet test --project tests/Ghostclip.Core.Tests -c Release --no-build
