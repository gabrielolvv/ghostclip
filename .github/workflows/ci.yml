name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Ghostclip.slnx -c Release

      - name: Test
        run: dotnet test --project tests/Ghostclip.Core.Tests -c Release --no-build
