name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/pages.yml']

permissions:
  contents: read

jobs:
  # The minimal LGPL FFmpeg the app ships, as the release builds it, for the integration tests.
  ffmpeg:
    name: Minimal LGPL FFmpeg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The build only changes when build/ffmpeg changes.
      - name: Cache
        id: cache
        uses: actions/cache@v6
        with:
          path: out
          key: ffmpeg-${{ hashFiles('build/ffmpeg/Dockerfile', 'build/ffmpeg/configure-flags.txt') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker build -t ghostclip-ffmpeg build/ffmpeg
          id=$(docker create ghostclip-ffmpeg)
          mkdir -p out
          for f in bin/ffmpeg.exe bin/ffprobe.exe COPYING.LGPLv2.1; do docker cp "$id:/out/$f" out/; done
          docker rm "$id"

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg
          path: out

  build:
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Ghostclip.slnx -c Release

      - name: Test
        run: dotnet test --project tests/Ghostclip.Core.Tests -c Release --no-build

      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg
          path: tools/ffmpeg-min

      # Trim, cut out, mute, the player's tracks, joining, GIFs and pictures, run by that FFmpeg on a made-up clip.
      - name: Integration tests
        env:
          GHOSTCLIP_FFMPEG_DIR: ${{ github.workspace }}\tools\ffmpeg-min
        run: dotnet test --project tests/Ghostclip.Integration.Tests -c Release --no-build
